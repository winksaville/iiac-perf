# iiac-perf project config: what a run started in this repo does beyond the built-in defaults.
#
# Nothing, since 0.28.19-9. The values this file held are the defaults now, so a run anywhere does
# what a run here did: ten runs of 0.25 s each, every run in a fresh process with 100 ms before
# it, ten blocks a run with 100 to 200 ms between them and 2 ms of warmup after each sleep, 0.1 s
# to settle and to warm, three decimals, the clock pinned at the host's `pin_mhz` (else its base
# clock), and the threads at the nearest placement the host declares, `smt` or else `ccx`.
#
# `iiac-perf init-config` prints every key at its default with the prose that explains it, and
# docs/config.md is the reference. A key set here applies to runs started in this directory and
# below, and a run's flags override it.
