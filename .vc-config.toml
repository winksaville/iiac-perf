# vc-config: Vibe Coding workspace configuration
#
# The [repos] registry records the workspace layout. Paths are relative to
# this config file's directory, so the two sides differ: the entry that
# resolves to this file's own directory names this side. Used to resolve
# changeID paths in git trailers (e.g. ochid: /changeID).
#
# This is the work side.

[repos]
work = "."
bot = ".claude"
